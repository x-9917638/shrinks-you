    /**
     * @template {keyof HTMLElementTagNameMap} K
     * @param {K} type
     * @returns {HTMLElementTagNameMap[K]}
     */
    const createElement = (type) => {
      return document.createElement(type);
    };

    /**
     * @template {Node} T
     * @param {T} node
     * @returns {T}
     */
    const appendChild = (node) => {
      return document.body.appendChild(node);
    };

    class Editor {
      /**
       * @param {string?} placeholder
       */
      constructor(placeholder) {
        const TEXTAREA = createElement("textarea");
        TEXTAREA.style = "width:48.77vw;height:30vh;font:monospace;color:#444";
        TEXTAREA.placeholder = placeholder ? placeholder : "";

        this.el = TEXTAREA;
      }

      asHTMLElement() {
        return this.el;
      }
    }

    /**
     * @param {WebGL2RenderingContext} gl
     * @param {WebGLShader} shader
     * @param {WebGLProgram} program
     * @returns {boolean?}
     */
    function compileAttachShader(gl, shader, program) {
      gl.compileShader(shader);
      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        const info = gl.getShaderInfoLog(shader);
        alert(`could not compile shader.\n\n${info}`);
        return true;
      }
      gl.attachShader(program, shader);
    }

    /**
     * @param {WebGL2RenderingContext} gl
     * @returns {WebGLBuffer}
     */
    function createInitBuffer(gl) {
      gl.enableVertexAttribArray(0);
      const buffer = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
      gl.vertexAttribPointer(0, 1, gl.FLOAT, false, 0, 0);
    }

    /**
     * @param {WebGL2RenderingContext} gl
     * @param {WebGLBuffer} buffer
     * @param {WebGLProgram} program
     */
    function cleanup(gl, buffer, program) {
      gl.useProgram(null);
      gl.deleteBuffer(buffer);
      gl.deleteProgram(program);
    }

    const heading = appendChild(createElement("h1"));
    const vert_buf = appendChild(
      new Editor("Enter vertex code here...").asHTMLElement(),
    );
    const frag_buf = appendChild(
      new Editor("Enter fragment code here...").asHTMLElement(),
    );
    const compile_button = appendChild(createElement("button"));
    const canvas = appendChild(createElement("canvas"));
    let gl = canvas.getContext("webgl2");

    function main() {
      heading.textContent = "GLSL/WebGL2 Tester";

      canvas.width = canvas.clientWidth;
      canvas.height = canvas.clientHeight;
      canvas.style = "background-color:white;border:1px solid;";

      compile_button.textContent = "Compile and run";

      resizeCanvas();

      window.onresize = resizeCanvas;
      compile_button.onclick = compile;
    }

    function resizeCanvas() {
      if (window.innerHeight * 0.99 >= (9 * (window.innerWidth * 0.99)) / 16) {
        canvas.width = window.innerWidth * 0.99;
        canvas.height = Math.floor((9 * canvas.width) / 16);
      } else {
        canvas.height = window.innerHeight * 0.99;
        canvas.width = Math.floor((16 * canvas.height) / 9);
      }

      gl = canvas.getContext("webgl2");

      if (!(gl instanceof WebGL2RenderingContext)) {
        alert("failed to create webgl2 context");
      }

      gl.viewport(0, 0, gl.drawingBufferWidth, gl.drawingBufferHeight);
      gl.clear(gl.COLOR_BUFFER_BIT);
    }

    function compile() {
      compile_button.disabled = true;

      let fragmentShader, vertexShader;
      const program = gl.createProgram();

      if (vert_buf.value) {
        vertexShader = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vertexShader, vert_buf.value);
        if (compileAttachShader(gl, vertexShader, program)) {
          cleanup(gl, null, program);
          compile_button.disabled = false;
          return;
        }
      }

      if (frag_buf.value) {
        fragmentShader = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fragmentShader, frag_buf.value);
        if (compileAttachShader(gl, fragmentShader, program)) {
          cleanup(gl, null, program);
          compile_button.disabled = false;
          return;
        }
      }

      gl.linkProgram(program);

      if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
        const info = gl.getProgramInfoLog(program);
        alert(`Could not compile program. \n\n${info}`);

        cleanup(gl, null, program);
        compile_button.disabled = false;
        return;
      }

      if (vertexShader) {
        gl.deleteShader(vertexShader);
        gl.detachShader(program, vertexShader);
      }
      if (fragmentShader) {
        gl.deleteShader(fragmentShader);
        gl.detachShader(program, fragmentShader);
      }

      const buffer = createInitBuffer(gl);

      gl.useProgram(program);
      gl.drawArrays(gl.POINTS, 0, 1);

      cleanup(gl, buffer, program);
      compile_button.disabled = false;
    }

    main();
  </script>
</body>
